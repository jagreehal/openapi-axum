# Supply-chain policy, enforced in CI by `cargo deny check`.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on any RustSec vulnerability, and on crates marked unmaintained or yanked.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only: everything here is compatible with shipping openapi-axum as MIT.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The Mozilla CA bundle (via reqwest's rustls verifier on Linux) is data, under a
# permissive data licence. Allowed for that crate only.
exceptions = [{ crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] }]

[bans]
# Duplicate versions are common across the OTel/tokio/hyper stack; report, don't fail.
multiple-versions = "warn"
wildcards = "deny"
# The workspace's own path dependency (openapi-axum -> openapi-axum-macros) is not a wildcard risk.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
