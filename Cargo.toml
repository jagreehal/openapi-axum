[workspace]
resolver = "3"
members = ["openapi-axum", "openapi-axum-macros"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Jag Reehal"]
license = "MIT"
repository = "https://github.com/jagreehal/openapi-axum"
homepage = "https://github.com/jagreehal/openapi-axum"

[workspace.dependencies]
openapi-axum-macros = { path = "openapi-axum-macros", version = "0.2.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
